<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f7ff;
      margin: 0;
      padding: 0;
      color: #1f2937;
    }

    .page-header {
      text-align: center;
      padding: 5px 5px;
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: white;
    }

    .page-header h1 {
      margin: 0;
      font-size: 2rem;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      background: #1e3a8a;
      padding: 15px;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 15px;
      border-radius: 8px;
      transition: 0.3s;
    }

    nav a:hover {
      background: #facc15;
      color: #1e3a8a;
    }

    #contact {
      max-width: 700px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    #contact h2 {
      text-align: left;
      color: #1e3a8a;
    }

    #contact p {
      text-align: left;
      margin-bottom: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      font-weight: bold;
      color: #1e3a8a;
    }

    input, textarea {
      padding: 12px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      transition: 0.3s;
    }

    input:focus, textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 8px rgba(37,99,235,0.3);
    }

    button {
      background: #2563eb;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: bold;
    }

    button:hover {
      background: #1e40af;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #1e40af;
      color: white;
      margin-top: 40px;
    }

    @media (max-width: 768px) {
      #contact {
        margin: 20px;
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <header class="page-header">
    <h1>Contact Me</h1>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="skils.html">Skills</a>
    <a href="certificates.html">Certificates</a>
    <a href="Hobbies.html">Hobbies</a>
    <a href="Projects.html">Projects</a>
    <a href="career.html">Career</a>
    <a href="contact.html">Contact</a>
  </nav>

  <section id="contact">
    <h2>Get In Touch</h2>
    <p>Send me a message and I will reply soon.</p>

    <form id="contactForm">
      <label>Name</label>
      <input type="text" id="name" placeholder="Your name">

      <label>Email</label>
      <input type="email" id="email" placeholder="Your email">

      <label>Message</label>
      <textarea id="message" rows="5" placeholder="Your message"></textarea>

      <button type="submit">Send Message</button>
    </form>

    <p id="status"></p>
  </section>

  <footer>
    Abdellateef © All rights reserved
  </footer>

  <script>
    const form = document.getElementById('contactForm');
    const status = document.getElementById('status');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const message = document.getElementById('message').value.trim();

      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!name || !email || !message) {
        status.style.color = "red";
        status.textContent = "Please fill in all fields.";
      }
      else if (!emailPattern.test(email)) {
        status.style.color = "red";
        status.textContent = "Please enter a valid email.";
      }
      else {
        status.style.color = "green";
        status.textContent = "Message sent successfully!";
        form.reset();
      }
    });
  </script>

</body>
</html>
