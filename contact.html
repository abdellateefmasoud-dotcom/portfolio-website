<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f7ff;
      margin: 0;
      padding: 0;
      color: #1f2937;
    }

    /* Header */
    header {
      text-align: center;
      padding: 50px 20px;
      background: linear-gradient(135deg, #2563eb, #1e40af);
      color: white;
    }

    header h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.2rem;
      opacity: 0.9;
    }

    /* Navigation */
    nav {
      display: flex;
      justify-content: center;
      gap: 30px;
      background: #1e3a8a;
      padding: 15px 0;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 20px;
      border-radius: 8px;
      transition: 0.3s;
    }

    nav a:hover {
      background: #facc15;
      color: #1e3a8a;
      transform: scale(1.05);
    }

    /* Contact Section */
    #contact {
      max-width: 700px;
      margin: 40px auto;
      padding: 40px;
      background: linear-gradient(135deg, #e0f2fe, #dbeafe);
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }

    #contact h2 {
      text-align: center;
      color: #1e3a8a;
      margin-bottom: 10px;
      font-size: 2rem;
    }

    #contact p {
      text-align: center;
      margin-bottom: 30px;
      color: #374151;
    }

    /* Form */
    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label {
      font-weight: bold;
      color: #1e3a8a;
    }

    input,
    textarea {
      padding: 12px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }

    input:focus,
    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.3);
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: bold;
    }

    button:hover {
      background: #1e40af;
      color: #facc15;
      transform: scale(1.03);
    }

    /* Contact Links */
    .contact-links {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .contact-links a {
      text-decoration: none;
      color: #1e3a8a;
      font-weight: bold;
      font-size: 18px;
      padding: 10px 20px;
      border-radius: 10px;
      background: #f0f4ff;
      transition: 0.3s;
    }

    .contact-links a:hover {
      background: #2563eb;
      color: #facc15;
      transform: scale(1.05);
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 25px 0;
      background: #1e40af;
      color: white;
      font-size: 14px;
      margin-top: 40px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      #contact {
        margin: 20px;
        padding: 25px;
      }

      header h1 {
        font-size: 2.2rem;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <h1>Contact Me</h1>
  </header>

  <!-- Navigation -->
  <nav>
    <a href="Who-I-Am.html">Home</a>
    <a href="projects.html">Networking Topics</a>
    <a href="contact.html">Contact</a>
  </nav>

  <!-- Contact Section -->
  <section id="contact" tabindex="-1">

    <h2>Contact Me</h2>

    <p>
      Use the form below to send me a message.
      I will get back to you as soon as possible.
    </p>

    <!-- Contact Form -->
    <form id="contactForm" novalidate>

      <label for="name">Name:</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Your full name"
        required
      />

      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="your.email@example.com"
        required
      />

      <label for="message">Message:</label>
      <textarea
        id="message"
        name="message"
        rows="5"
        placeholder="Your message here..."
        required
      ></textarea>

      <button type="submit">Send Message</button>

    </form>

    <!-- Contact Links -->
    <div class="contact-links" id="contact-links">
      <!-- JavaScript will add links -->
    </div>

  </section>

  <!-- Footer -->
  <footer>
    <p>Abdellateef © All rights reserved</p>
  </footer>

  <!-- JavaScript -->
  <script>


    // Form Validation
    const form = document.getElementById('contactForm');

    form.addEventListener('submit', function(e) {

      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const message = document.getElementById('message').value.trim();

      if(name === '' || email === '' || message === '') {

        alert('Please fill in all fields.');

      } else {

        alert('Message sent successfully!');

        form.reset();
      }

    });

  </script>

</body>
</html>
